[package]
name = "ziggurat-zcash"
version = "0.1.0"
authors = ["Niklas Long <niklas@equilibrium.co>, Mirko von Leipzig <mirko@equilibrium.co>", "Ziggurat contributors"]
edition = "2021"

[dependencies]
assert_matches = "1.5"
async-trait = "0.1"
bytes = "1"
chrono = "0.4"
dns-lookup = "2.0"
hex = "0.4"
home = "0.5"
lazy_static = "1.4"
metrics = "0.21"
metrics-exporter-prometheus = { version = "0.12", default-features = false, features = ["http-listener"], optional = true }
metrics-util = "0.15"
parking_lot = "0.12"
pea2pea = "0.46"
prost = { version = "0.14", optional = true }
rand = "0.8"
rand_chacha = "0.3"
regex = "1"
sha2 = "0.10"
spectre = { git = "https://github.com/niklaslong/spectre", rev = "9a0664f" }
tabled = "0.10"
time = "0.3"
toml = "0.7"
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen", "tls-ring", "tls-webpki-roots"], optional = true }
tonic-prost = { version = "0.14", optional = true }
zebra-chain = "15.0.0"
ziggurat-core-crawler = { git = "https://github.com/runziggurat/ziggurat-core", rev = "33ef131" }
ziggurat-core-metrics = { git = "https://github.com/runziggurat/ziggurat-core", rev = "33ef131" }
ziggurat-core-utils = { git = "https://github.com/runziggurat/ziggurat-core", rev = "33ef131" }

[dependencies.clap]
version = "4.2"
features = ["derive"]
optional = true

[dependencies.flate2]
version = "1"
optional = true

[dependencies.futures-util]
version = "0.3"
features = ["sink"]

[dependencies.jsonrpsee]
version = "0.16"
features = ["server"]
optional = true

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"
features = ["preserve_order"]
optional = true

[dependencies.tokio]
version = "1"
features = ["full"]

[dependencies.tokio-util]
version = "0.7"
features = ["codec"]

[dependencies.zstd]
version = "0.13"
optional = true

[dependencies.tracing]
version = "0.1"
default-features = false

[dependencies.tracing-subscriber]
version = "0.3"
features = ["env-filter", "fmt"]

[features]
crawler = ["clap", "flate2", "jsonrpsee", "serde_json"]
mempool = [
    "clap",
    "flate2",
    "serde_json",
    "dep:metrics-exporter-prometheus",
    "dep:prost",
    "dep:tonic",
    "dep:tonic-prost",
    "dep:zstd",
]

[[bin]]
name = "crawler"
path = "src/tools/crawler/main.rs"
required-features = ["crawler"]

[[bin]]
name = "mempool-listener"
path = "src/tools/mempool/main.rs"
required-features = ["mempool"]
