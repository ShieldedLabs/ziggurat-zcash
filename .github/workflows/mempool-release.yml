# Builds the mempool-listener Linux binary and attaches it to a release.
# Shell steps only: the runner's git, rustup and gh replace the JavaScript actions.
name: mempool-listener release

on:
  push:
    tags: ["mempool-v*"]

jobs:
  build:
    # Ubuntu 22.04 glibc runs on Debian bookworm.
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      ASSET: mempool-listener-x86_64-linux
    steps:
      - name: Check out
        run: |
          git init -q .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Test
        run: cargo test --features mempool --bin mempool-listener
      - name: Build
        run: cargo build --release --features mempool --bin mempool-listener
      - name: Release
        run: |
          cp target/release/mempool-listener "$ASSET"
          sha256sum "$ASSET" > "$ASSET.sha256"
          gh release create "$GITHUB_REF_NAME" "$ASSET" "$ASSET.sha256" \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "mempool-listener ${GITHUB_REF_NAME#mempool-v}, built from $GITHUB_SHA."
