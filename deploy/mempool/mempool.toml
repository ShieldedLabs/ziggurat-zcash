# mempool-listener config for the metrics VPS. The rules sections hold the defaults.
# Tune the rule thresholds after a week of data. Grafana alerts on depth, peers
# and liveness from the metrics, and on the mempool_alerts_total{rule} counter.

[listener]
# Copy a census-*.ndjson.gz from the crawler here. The listener reads it at start.
census_dir = "/data/census"
# Peers to use instead of the census:
# peers = ["203.0.113.5:8233"]
target_peers = 50
data_dir = "/data/mempool"
user_agent = "/zero-mempool:0.1.0/"
# Prometheus scrapes mempool-listener:9101 on metrics-net. No port is published.
metrics_addr = "0.0.0.0:9101"
mempool_poll_secs = 60
getdata_timeout_secs = 30
gone_after_secs = 600
reconnect_secs = 120
max_failures = 1

[lookup]
# Public lightwalletd servers. The listener asks them for the parent txs of transparent
# inputs, to get the fee. It caches the parents' output values in data_dir/prevouts.ndjson.
# It also polls them for the chain tip every 30 s, for `gone` events.
servers = ["https://zec.rocks:443", "https://na.zec.rocks:443", "https://eu.zec.rocks:443"]
per_sec = 10.0
timeout_secs = 120
max_pending = 20

[wire]
# Every frame in and out, plus connect, handshake and disconnect events, as hourly
# wire-YYYYMMDD-HH.ndjson.zst files. Remove dir to turn it off.
dir = "/data/wire"
zstd_level = 9

[rules]
cooldown_secs = 3600

[rules.burst]
count = 5
window_secs = 600
factor = 3.0
max_chance = 0.0001
baseline_secs = 3600
size_bucket_bytes = 1000

[rules.under_floor]
count = 3
window_secs = 600
zats_per_action = 1000

[rules.large_tx]
bytes = 100000
