# Runs the mempool listener on the metrics VPS. Fill .env from .env.example first.
# Prometheus scrapes mempool-listener:9101 on metrics-net. Grafana sends the alerts.

services:
  listener:
    container_name: mempool-listener
    build:
      context: .
      args:
        RELEASE_URL: ${RELEASE_URL}
    command: ["mempool-listener", "--config", "/etc/mempool/mempool.toml"]
    environment:
      RUST_LOG: info
    volumes:
      - ./mempool.toml:/etc/mempool/mempool.toml:ro
      - ./data:/data
    # A tx flood grows the listener. The cap keeps Grafana and Prometheus safe.
    mem_limit: 512m
    networks:
      - metrics-net
    restart: unless-stopped

networks:
  metrics-net:
    external: true
