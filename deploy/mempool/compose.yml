# Runs the mempool listener. Fill .env from .env.example first.
# Grafana on the metrics VPS scrapes :9101 over the VPC and sends the alerts.

services:
  listener:
    build:
      context: .
      args:
        RELEASE_URL: ${RELEASE_URL}
    command: ["mempool-listener", "--config", "/etc/mempool/mempool.toml"]
    environment:
      RUST_LOG: info
    volumes:
      - ./mempool.toml:/etc/mempool/mempool.toml:ro
      - ./data:/data
    ports:
      # Prometheus, on the VPC address only.
      - "${VPC_IP}:9101:9101"
    restart: unless-stopped
