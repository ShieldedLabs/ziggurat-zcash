base-url: "https://alerts.shieldedinfra.net"
listen-http: ":80"
behind-proxy: true

# Nobody reads or writes without a user. See README.md for the users.
auth-file: "/var/lib/ntfy/user.db"
auth-default-access: "deny-all"
enable-signup: false

cache-file: "/var/cache/ntfy/cache.db"
cache-duration: "720h"

# iOS gets instant push only through ntfy.sh. ntfy.sh sees a message id, not the message.
upstream-base-url: "https://ntfy.sh"
